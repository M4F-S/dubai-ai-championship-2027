name: C99 Sovereign Adapter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Disable needrestart interactive prompts
      run: |
        sudo mkdir -p /etc/needrestart/conf.d
        echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/no-prompt.conf

    - name: Install dependencies
      run: |
        sudo grep -rl "azure.archive.ubuntu.com" /etc/apt/ | xargs -r sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g'
        sudo apt-get -o Acquire::ForceIPv4=true update -qq
        sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::ForceIPv4=true install -y -qq --no-install-recommends libcurl4-openssl-dev libsqlite3-dev

    - name: Run C99 Adapter Test Battery (-Wall -Wextra -Werror)
      run: |
        make clean
        make test
