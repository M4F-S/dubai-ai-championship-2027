name: C99 Sovereign Adapter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Run C99 Adapter Test Battery (-Wall -Wextra -Werror)
      run: |
        make clean
        make test
